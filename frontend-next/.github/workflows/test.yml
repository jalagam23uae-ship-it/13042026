name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: lint + type-check + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend-next/coverage
          retention-days: 7

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    # Only run e2e if unit tests passed — they're expensive.
    needs: unit
    defaults:
      run:
        working-directory: frontend-next
    services:
      # The e2e suite needs a running backend. Replace this with the
      # project's real backend image + env once it's containerized.
      # Alternatively, use docker-compose via a separate step.
      backend:
        image: ghcr.io/your-org/atp-backend:latest
        ports:
          - 8000:8000
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-not-for-prod
        options: >-
          --health-cmd="curl -f http://localhost:8000/healthz || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
    env:
      API_URL_INTERNAL: http://localhost:8000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # Seed user credentials — must match backend/seed.py output.
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: admin123
      E2E_STUDENT_EMAIL: student@example.com
      E2E_STUDENT_PASSWORD: student123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start Next.js in background
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Seed backend
        # Replace with your real seeding script. This assumes a dev
        # endpoint; in real CI you'd run backend/seed.py inside the
        # backend service.
        run: curl -f http://localhost:8000/dev/seed || echo "Skipping seed"

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-next/playwright-report
          retention-days: 7
